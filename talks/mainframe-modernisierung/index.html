<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mainframe-Modernisierung — Vom Bestandsüberblick zur AI-gestützten Transformation</title>
  <link rel="stylesheet" href="../../node_modules/reveal.js/dist/reset.css">
  <link rel="stylesheet" href="../../node_modules/reveal.js/dist/reveal.css">
  <link rel="stylesheet" href="../../templates/themes/epam.css">
  <link rel="stylesheet" href="../../node_modules/reveal.js/plugin/highlight/monokai.css">
  <style>
    /* ─────────────────────────────────────────────────────────────
       Deck v3: Mainframe-Modernisierung · house style epam · 16:9 (1280×720)
       Four phase sections (Analysieren · Planen · Umsetzen · Überführen),
       each with a breaker; objection-chip system; airy-spoken density.
       ───────────────────────────────────────────────────────────── */
    :root { --r-main-font-size: 24px; --r-block-margin: 10px; }
    .reveal::after { display: none !important; }   /* kill global logo watermark */

    .reveal .slides section { padding: 46px 56px 40px; height: 720px; box-sizing: border-box; }
    /* Body slides: center content vertically so the vertical space is used, not crammed to the top. */
    .reveal .slides section[data-marker] { display: flex; flex-direction: column; justify-content: center; }
    /* Reserve a fixed bottom band for the takeaway on every content slide. */
    .reveal .slides section[data-tk] { padding-bottom: 96px; }

    /* ── Fixed key-takeaway band (bottom-centre, identical on every content slide) ── */
    .reveal .takeaway { position: absolute; left: 56px; right: 56px; bottom: 38px; text-align: center; pointer-events: none; }
    .reveal .takeaway .tk-label { display: block; font-family: var(--r-heading-font); font-size: 10px; font-weight: 700; letter-spacing: 0.24em; text-transform: uppercase; color: var(--epam-accent); margin-bottom: 4px; }
    .reveal .takeaway .tk-text { display: block; font-size: 16px; font-weight: 600; line-height: 1.25; color: #E6E9ED; max-width: 940px; margin: 0 auto; }

    /* ── Slide title band ─────────────────────────────── */
    .reveal .title {
      font-family: var(--r-heading-font); font-weight: 700; color: #fff;
      font-size: 29px; line-height: 1.2; letter-spacing: -0.02em; margin: 0 0 6px; max-width: 90%;
    }
    .reveal .title .ac { color: var(--epam-blue); }
    .reveal .lead-in { color: var(--epam-subtle); font-size: 18px; font-style: italic; margin: 0 0 10px; }
    .reveal .teil { color: var(--epam-accent); font-size: 15px; font-weight: 600; letter-spacing: 0.04em; margin: 2px 0 12px; }
    .reveal .subline { color: var(--epam-subtle); font-size: 15px; }

    /* ── Marker (top-left) + footer ───────────────────── */
    .reveal .marker { position: absolute; top: 20px; left: 56px; font-family: var(--r-heading-font); font-size: 14px; color: var(--epam-subtle); letter-spacing: 0.08em; font-weight: 500; }
    .reveal .deck-footer { position: absolute; bottom: 14px; left: 56px; right: 56px; display: flex; justify-content: space-between; font-size: 11px; color: rgba(139,148,158,0.75); letter-spacing: 0.04em; font-family: var(--r-heading-font); }
    .reveal .deck-footer .mid { color: var(--epam-subtle); }

    /* ── Objection quote chip (§2) ────────────────────── */
    .reveal .qchip {
      display: inline-block; font-size: 14px; font-weight: 500; color: #C9D1D9;
      padding: 7px 13px; border-radius: 8px; border: 1px solid rgba(139,148,158,0.45);
      background: rgba(139,148,158,0.06); font-style: italic;
    }
    .reveal .qchip.answer { position: absolute; top: 18px; right: 56px; }

    /* ── Cross-reference chip (§4) ────────────────────── */
    .reveal .xref { display: inline-block; font-size: 14px; font-weight: 500; padding: 5px 12px; border-radius: 18px; background: rgba(0,160,227,0.10); border: 1px solid rgba(0,160,227,0.28); color: var(--epam-blue); }
    .reveal .xref::before { content: "→ "; opacity: 0.8; }

    /* ── Placeholder tags ─────────────────────────────── */
    .reveal .tag { font-size: 13px; font-style: normal; line-height: 1.3; display: inline-block; }
    .reveal .tag-confirm, .reveal .tag-owner { color: #E35050; }
    .reveal .tag-open { color: #E3A000; }

    /* ── Klartext-Schatten (§1) ───────────────────────── */
    .reveal .sh { color: var(--epam-subtle); font-size: 0.62em; font-weight: 400; }

    /* ── Body / supporting lines ──────────────────────── */
    .reveal .body-line { font-size: 22px; color: #E6E9ED; line-height: 1.28; margin: 4px 0; }
    .reveal .body-line .ac { color: var(--epam-blue); }
    .reveal .sup-line  { font-size: 14px; color: var(--epam-subtle); line-height: 1.3; margin: 4px 0; }

    /* ── Number tiles ─────────────────────────────────── */
    .reveal .tile-row { display: flex; gap: 16px; align-items: stretch; }
    .reveal .tile { flex: 1; background: var(--epam-surface); border: 1px solid var(--epam-border); border-radius: 12px; padding: 18px 16px; text-align: left; display: flex; flex-direction: column; }
    .reveal .tile.accent { border-color: rgba(0,201,167,0.55); }
    .reveal .tile .num { font-family: var(--r-heading-font); font-weight: 800; letter-spacing: -0.03em; font-size: 46px; line-height: 1; background: linear-gradient(135deg, var(--epam-blue), var(--epam-accent)); -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; }
    .reveal .tile .cap { font-size: 14px; color: #C9D1D9; margin-top: 8px; line-height: 1.25; }
    .reveal .tile .src { font-size: 12px; color: var(--epam-subtle); margin-top: auto; padding-top: 8px; }

    /* ── Cards ────────────────────────────────────────── */
    .reveal .card { padding: 16px 18px; }
    .reveal .card h4 { margin: 0 0 8px; font-size: 20px; color: #fff; }
    .reveal .card .cl { font-size: 15px; color: var(--epam-subtle); margin: 4px 0; line-height: 1.3; }

    /* ── Node / chip primitives ───────────────────────── */
    .reveal .node { background: rgba(0,160,227,0.12); border: 1.5px solid var(--epam-blue); border-radius: 12px; padding: 14px 20px; color: #fff; font-weight: 600; font-family: var(--r-heading-font); text-align: center; }
    .reveal .node.teal { background: rgba(0,201,167,0.12); border-color: var(--epam-accent); }
    .reveal .chip { display: inline-block; background: var(--epam-surface); border: 1px solid var(--epam-border); border-radius: 8px; padding: 8px 12px; font-size: 14px; color: #C9D1D9; }
    .reveal .chip.blue { background: rgba(0,160,227,0.10); border-color: rgba(0,160,227,0.3); color: #fff; }
    .reveal .arrow { color: var(--epam-subtle); font-size: 22px; align-self: center; }
    .reveal .hex { color: var(--epam-accent); font-size: 18px; align-self: center; }

    /* ── Outcome strip (repeating, last slide of each section) ── */
    .reveal .outcome { border: 1px solid rgba(0,201,167,0.5); background: rgba(0,201,167,0.07); border-radius: 10px; padding: 10px 16px; font-size: 14px; color: #E6E9ED; }
    .reveal .outcome b { color: var(--epam-accent); }

    /* ── Screenshot / UI-mock placeholder ─────────────── */
    .reveal .shot { background: repeating-linear-gradient(135deg, #12161c, #12161c 12px, #151a21 12px, #151a21 24px); border: 1px dashed rgba(139,148,158,0.4); border-radius: 10px; display: flex; align-items: center; justify-content: center; text-align: center; color: var(--epam-subtle); font-size: 12px; padding: 14px; }
    .reveal .mock { background: #10141a; border: 1px solid var(--epam-border); border-radius: 10px; text-align: left; overflow: hidden; }
    .reveal .mock .bar { background: rgba(0,160,227,0.08); border-bottom: 1px solid var(--epam-border); padding: 8px 14px; font-size: 13px; color: #C9D1D9; }
    .reveal .mock .rows { padding: 6px 0; }
    .reveal .mock .row { display: flex; gap: 12px; padding: 8px 14px; border-bottom: 1px solid rgba(139,148,158,0.08); font-size: 13px; color: #C9D1D9; align-items: center; }
    .reveal .mock .row.sel { background: rgba(0,160,227,0.08); }
    .reveal .mock .pill { font-size: 11px; padding: 2px 8px; border-radius: 12px; }
    .reveal .mock .ok { background: rgba(0,201,167,0.16); color: var(--epam-accent); }
    .reveal .mock .warn { background: rgba(227,160,0,0.16); color: #E3A000; }

    /* ── Matrix (slide 19) ────────────────────────────── */
    .reveal .matrix { width: 100%; border-collapse: separate; border-spacing: 0; font-size: 13px; }
    .reveal .matrix th { font-family: var(--r-heading-font); font-size: 13px; color: #fff; padding: 6px 8px; text-align: center; border-bottom: 1px solid var(--epam-blue); }
    .reveal .matrix td { padding: 7px 8px; border-bottom: 1px solid rgba(139,148,158,0.12); }
    .reveal .matrix td.lbl { color: #C9D1D9; text-align: left; }
    .reveal .matrix td.cell { text-align: center; color: var(--epam-blue); font-size: 16px; }
    .reveal .matrix .span { background: rgba(0,201,167,0.12); color: var(--epam-accent); text-align: center; border-radius: 6px; font-size: 12px; padding: 6px; }

    /* ── Breaker (§3) ─────────────────────────────────── */
    .reveal section.breaker { padding: 0; }
    .reveal .breaker .bg { position: absolute; inset: 0; }
    .reveal .breaker .wrap { position: absolute; left: 72px; bottom: 96px; width: 78%; text-align: left; }
    .reveal .breaker .sec { font-family: var(--r-heading-font); font-size: 14px; letter-spacing: 0.18em; text-transform: uppercase; color: var(--epam-blue); margin-bottom: 14px; }
    .reveal .breaker h1 { font-size: 56px; line-height: 1.06; margin: 0; text-align: left; }
    .reveal .breaker h1::after { display: none; }
    .reveal .breaker h1 .ac { color: var(--epam-blue); }
    .reveal .breaker .sup { color: #C9D1D9; font-size: 19px; margin-top: 20px; max-width: 82%; line-height: 1.35; }
    .reveal .breaker .imgtag { position: absolute; top: 20px; left: 56px; }

    .reveal .appendix-tag { color: var(--epam-subtle); font-size: 12px; letter-spacing: 0.14em; text-transform: uppercase; }
    .reveal .logo { position: absolute; bottom: 30px; left: 56px; height: 30px; opacity: 0.9; }
    .reveal table.wave { font-size: 13px; width: 100%; }
    .reveal table.wave th, .reveal table.wave td { padding: 7px 9px; }

    /* ── Slide 02: chaos → order morph (chips move to their column) ── */
    .reveal .morph { position: relative; height: 400px; margin-top: 6px; }
    .reveal .morph .mchip {
      position: absolute; font-size: 12px; padding: 5px 9px; white-space: nowrap; z-index: 2;
      transition: left .85s cubic-bezier(.22,1,.36,1), top .85s cubic-bezier(.22,1,.36,1), transform .85s cubic-bezier(.22,1,.36,1);
    }
    .reveal .morph .scaf { opacity: 0; transition: opacity .5s ease .3s; }
    .reveal .morph:has(.morph-trigger.visible) .scaf { opacity: 1; }
    .reveal .morph .col-f { position: absolute; top: 0; left: 0; width: 100%; }
    .reveal .morph .col-h { position: absolute; top: 34px; width: 23%; }
    .reveal .morph .col-c { position: absolute; top: 68px; width: 23%; }
    .reveal .morph .col-o { position: absolute; top: 252px; width: 23%; }
    .reveal .morph .col-x { position: absolute; top: 372px; left: 20%; }
    .reveal .morph .cL1 { left: 0; } .reveal .morph .cL2 { left: 25.5%; }
    .reveal .morph .cL3 { left: 51%; } .reveal .morph .cL4 { left: 76.5%; }
    /* chaos (default) chip positions — must live in CSS so the :has() ordered rules can override */
    .reveal .morph .m1  { left: 12%; top: 210px; transform: rotate(-3deg); }
    .reveal .morph .m2  { left: 57%; top: 302px; transform: rotate(2deg); }
    .reveal .morph .m3  { left: 23%; top: 120px; transform: rotate(4deg); }
    .reveal .morph .m4  { left: 63%; top: 92px;  transform: rotate(-2deg); }
    .reveal .morph .m5  { left: 9%;  top: 315px; transform: rotate(3deg); }
    .reveal .morph .m6  { left: 34%; top: 255px; transform: rotate(-4deg); }
    .reveal .morph .m7  { left: 69%; top: 212px; transform: rotate(2deg); }
    .reveal .morph .m8  { left: 45%; top: 150px; transform: rotate(-3deg); }
    .reveal .morph .m9  { left: 80%; top: 308px; transform: rotate(3deg); }
    .reveal .morph .m10 { left: 40%; top: 44px;  transform: rotate(-2deg); }
    /* ordered chip targets — revealed when the fragment trigger becomes visible */
    .reveal .morph:has(.morph-trigger.visible) .m1  { left: 0;      top: 120px; transform: none; }
    .reveal .morph:has(.morph-trigger.visible) .m2  { left: 0;      top: 158px; transform: none; }
    .reveal .morph:has(.morph-trigger.visible) .m3  { left: 25.5%;  top: 120px; transform: none; }
    .reveal .morph:has(.morph-trigger.visible) .m4  { left: 25.5%;  top: 158px; transform: none; }
    .reveal .morph:has(.morph-trigger.visible) .m5  { left: 51%;    top: 120px; transform: none; }
    .reveal .morph:has(.morph-trigger.visible) .m6  { left: 51%;    top: 158px; transform: none; }
    .reveal .morph:has(.morph-trigger.visible) .m7  { left: 51%;    top: 196px; transform: none; }
    .reveal .morph:has(.morph-trigger.visible) .m8  { left: 76.5%;  top: 120px; transform: none; }
    .reveal .morph:has(.morph-trigger.visible) .m9  { left: 76.5%;  top: 158px; transform: none; }
    .reveal .morph:has(.morph-trigger.visible) .m10 { left: 0;      top: 372px; transform: none; }

    /* ── Slide 04: Strangler-Fig stages ── */
    .reveal .strangler { display: flex; align-items: stretch; margin-top: 14px; }
    .reveal .st { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 6px; text-align: center; padding: 0 3px; }
    .reveal .stsep { align-self: center; color: var(--epam-subtle); font-size: 14px; padding: 0 2px; }
    .reveal .st .usr { color: var(--epam-subtle); font-size: 12px; letter-spacing: 3px; line-height: 1; }
    .reveal .st .ind { width: 100%; box-sizing: border-box; background: rgba(0,160,227,0.85); color: #fff; font-size: 9px; font-weight: 600; padding: 4px 2px; border-radius: 5px; font-family: var(--r-heading-font); }
    .reveal .st .indsp { width: 100%; height: 21px; }
    .reveal .st .bodyrow { display: flex; gap: 4px; width: 100%; height: 66px; }
    .reveal .st .blk { border-radius: 6px; color: #fff; font-size: 10px; font-weight: 700; font-family: var(--r-heading-font); display: flex; align-items: center; justify-content: center; }
    .reveal .st .leg { background: rgba(227,80,80,0.82); }
    .reveal .st .new { background: rgba(0,201,167,0.9); color: #0D1117; }
    .reveal .st .dbrow { display: flex; gap: 5px; width: 100%; justify-content: center; align-items: center; height: 22px; }
    .reveal .st .db { width: 34px; height: 18px; border-radius: 50% / 34%; }
    .reveal .st .db.leg { background: rgba(227,80,80,0.82); }
    .reveal .st .db.new { background: rgba(0,201,167,0.9); }
    .reveal .st .cdc { color: var(--epam-accent); font-size: 12px; }
    .reveal .st .sn { font-family: var(--r-heading-font); font-weight: 700; font-size: 13px; color: #fff; margin-top: 2px; }
    .reveal .st .sc { font-size: 10px; color: var(--epam-subtle); line-height: 1.15; }

    /* ── Slide 05: conceptual technik+fachlichkeit graph ── */
    .reveal .graph { position: relative; width: 100%; height: 330px; margin-top: 8px; }
    .reveal .graph > svg { position: absolute; inset: 0; width: 100%; height: 100%; }
    .reveal .gnode { position: absolute; transform: translate(-50%,-50%); border-radius: 8px; padding: 5px 9px; font-size: 11px; line-height: 1.15; text-align: center; font-family: var(--r-heading-font); z-index: 2; white-space: nowrap; }
    .reveal .gtech { background: rgba(0,160,227,0.16); border: 1px solid rgba(0,160,227,0.55); color: #E6E9ED; }
    .reveal .gbiz  { background: rgba(0,201,167,0.16); border: 1px solid rgba(0,201,167,0.6); color: #E6E9ED; }
    .reveal .gnode b { color: #fff; font-weight: 700; display: block; font-size: 12px; }
    .reveal .gnode .ty { font-size: 9px; letter-spacing: 0.06em; text-transform: uppercase; color: var(--epam-subtle); }
    .reveal .gband { position: absolute; font-size: 12px; font-weight: 600; z-index: 2; }

    /* ── Slide 07: informational composition — nested scope + ownership ── */
    .reveal .nest { border: 1.5px solid; border-radius: 11px; padding: 8px 11px; }
    .reveal .nest .nlbl { font-family: var(--r-heading-font); font-weight: 700; font-size: 13px; margin-bottom: 5px; }
    .reveal .nest .nlbl .sc { font-size: 10px; font-weight: 500; color: var(--epam-subtle); text-transform: uppercase; letter-spacing: 0.05em; margin-left: 6px; }
    .reveal .nest .nlbl b { color: #fff; }
    .reveal .nest.ent  { border-color: rgba(139,148,158,0.5);  background: rgba(139,148,158,0.05); }
    .reveal .nest.prog { border-color: rgba(0,160,227,0.45);  background: rgba(0,160,227,0.045); margin-top: 8px; }
    .reveal .nest.app  { border-color: rgba(0,201,167,0.5);   background: rgba(0,201,167,0.05);  margin-top: 8px; }
    .reveal .ochip { display: inline-block; font-size: 11.5px; padding: 4px 9px; border-radius: 7px; border: 1px solid; color: #E6E9ED; margin: 2px 3px 2px 0; }
    .reveal .own-ea   { border-color: #00A0E3; background: rgba(0,160,227,0.14); }
    .reveal .own-sec  { border-color: #E35050; background: rgba(227,80,80,0.14); }
    .reveal .own-biz  { border-color: #00C9A7; background: rgba(0,201,167,0.14); }
    .reveal .own-qa   { border-color: #E3A000; background: rgba(227,160,0,0.14); }
    .reveal .own-gov  { border-color: #A970FF; background: rgba(169,112,255,0.14); }
    .reveal .own-tech { border-color: var(--epam-blue); background: rgba(0,160,227,0.10); }
    .reveal .odot { display: inline-block; width: 9px; height: 9px; border-radius: 50%; margin-right: 5px; vertical-align: middle; }
  </style>
</head>

  <script src="../../node_modules/reveal.js/dist/reveal.js"></script>
  <script src="../../node_modules/reveal.js/plugin/notes/notes.js"></script>
  <script src="../../node_modules/reveal.js/plugin/highlight/highlight.js"></script>
  <!-- Language dictionaries: German is the lead language, English overrides it. -->
  <script src="i18n/de.js"></script>
  <script src="i18n/en.js"></script>
  <script>
    // ── i18n ── German leads; press "L" to toggle DE⇄EN. Per-section text lives
    // in i18n/{de,en}.js (one HTML entry per <section>, in DOM order). The marker,
    // footer and takeaway travel inside that content or are re-injected below.
    window.I18N = window.I18N || {};
    var SECTIONS = document.querySelectorAll('.reveal .slides > section');

    function pickLang() {
      var q = new URLSearchParams(location.search).get('lang');
      return (q === 'en' || q === 'de') ? q : (localStorage.getItem('deck-lang') || 'de');
    }
    var lang = pickLang();

    // Section marker (top-left) + three-part footer on every marked body/appendix
    // slide. Cover and breakers carry no data-marker → no marker, no footer.
    // Re-runnable: innerHTML fill wipes prior chrome, so we just (re-)append.
    function injectChrome() {
      document.querySelectorAll('.reveal .slides section[data-marker]').forEach(function (s) {
        var m = s.dataset.marker;
        var marker = document.createElement('div');
        marker.className = 'marker'; marker.textContent = m; s.appendChild(marker);
        var f = document.createElement('div');
        f.className = 'deck-footer';
        f.innerHTML = '<span>EPAM · Public</span><span class="mid">Mainframe-Modernisierung</span><span>' + m + '</span>';
        s.appendChild(f);
      });
    }

    function applyLang(l) {
      var dict = window.I18N[l] || window.I18N.de || [];
      SECTIONS.forEach(function (s, i) { if (dict[i] != null) s.innerHTML = dict[i]; });
      document.documentElement.lang = l;
      localStorage.setItem('deck-lang', l);
      lang = l;
      injectChrome();
    }

    applyLang(lang);   // fill content before Reveal reads the DOM

    Reveal.initialize({
      width: 1280, height: 720, margin: 0.04,
      center: false, hash: true, slideNumber: false, transition: 'slide',
      plugins: [RevealNotes, RevealHighlight]
    });

    // Toggle language with "L" (ignored while typing in a field).
    document.addEventListener('keydown', function (e) {
      if (e.key !== 'l' && e.key !== 'L') return;
      var t = (e.target && e.target.tagName || '').toLowerCase();
      if (t === 'input' || t === 'textarea' || t === 'select') return;
      applyLang(lang === 'de' ? 'en' : 'de');
      if (window.Reveal) { try { Reveal.sync(); } catch (err) {} }
      setTimeout(drawGraph5, 40);
      e.preventDefault();
    });

    // Slide 05 knowledge graph — draw each edge from box-border to box-border
    // (nearest edge, not centre) and label it. Redrawn on layout changes.
    function drawGraph5() {
      var c = document.getElementById('g5'), svg = document.getElementById('g5svg');
      if (!c || !svg) return;
      var W = c.clientWidth, H = c.clientHeight;
      if (!W || !H) return;
      svg.setAttribute('viewBox', '0 0 ' + W + ' ' + H);
      var NS = 'http://www.w3.org/2000/svg';
      // node visual centre = (offsetLeft, offsetTop) because of translate(-50%,-50%)
      function box(id) {
        var el = c.querySelector('[data-g="' + id + '"]');
        if (!el) return null;
        return { cx: el.offsetLeft, cy: el.offsetTop, hw: el.offsetWidth / 2, hh: el.offsetHeight / 2 };
      }
      function border(r, px, py) { // point on r's border toward (px,py), +3px gap
        var dx = px - r.cx, dy = py - r.cy;
        if (!dx && !dy) return { x: r.cx, y: r.cy };
        var t = Math.min(dx ? r.hw / Math.abs(dx) : Infinity, dy ? r.hh / Math.abs(dy) : Infinity);
        var len = Math.hypot(dx, dy), g = (t * len + 3) / len;
        return { x: r.cx + dx * g, y: r.cy + dy * g };
      }
      var C = { sub: '#5B6875', teal: '#00C9A7' };
      var edges = [
        // technical dependencies
        { a: 'terminal', b: 'cics', k: 'tech', l: 'bedient' },
        { a: 'java', b: 'cics', k: 'tech', l: 'ruft auf' },
        { a: 'java', b: 'mq', k: 'tech', l: 'sendet' },
        { a: 'jcl', b: 'cobol', k: 'tech', l: 'startet' },
        { a: 'cics', b: 'cobol', k: 'tech', l: 'ruft' },
        { a: 'cobol', b: 'db2', k: 'tech', l: 'liest/schreibt' },
        { a: 'cobol', b: 'vsam', k: 'tech', l: 'liest/schreibt' },
        { a: 'cics', b: 'mq', k: 'tech', l: 'put/get' },
        // business relations
        { a: 'bs', b: 'boV', k: 'biz', l: 'nutzt' },
        { a: 'bs', b: 'boK', k: 'biz', l: 'nutzt' },
        { a: 'boV', b: 'rq', k: 'biz', l: 'erfüllt' },
        // citations (FINIUS connects technik ↔ fachlichkeit)
        { a: 'cics', b: 'bs', k: 'cite', l: 'implementiert' },
        { a: 'cobol', b: 'bs', k: 'cite', l: 'implementiert' },
        { a: 'cobol', b: 'rq', k: 'cite', l: 'erfüllt Regel' },
        { a: 'db2', b: 'boV', k: 'cite', l: 'entspricht' },
        { a: 'vsam', b: 'boK', k: 'cite', l: 'entspricht' }
      ];
      while (svg.firstChild) svg.removeChild(svg.firstChild);
      edges.forEach(function (e) {
        var A = box(e.a), B = box(e.b);
        if (!A || !B) return;
        var p1 = border(A, B.cx, B.cy), p2 = border(B, A.cx, A.cy);
        var stroke = e.k === 'tech' ? C.sub : C.teal;
        var ln = document.createElementNS(NS, 'line');
        ln.setAttribute('x1', p1.x); ln.setAttribute('y1', p1.y);
        ln.setAttribute('x2', p2.x); ln.setAttribute('y2', p2.y);
        ln.setAttribute('stroke', stroke); ln.setAttribute('stroke-width', '1.5');
        ln.setAttribute('opacity', e.k === 'tech' ? '0.75' : '0.9');
        if (e.k === 'cite') ln.setAttribute('stroke-dasharray', '5 4');
        svg.appendChild(ln);
        var tx = document.createElementNS(NS, 'text');
        tx.setAttribute('x', (p1.x + p2.x) / 2); tx.setAttribute('y', (p1.y + p2.y) / 2 - 2);
        tx.setAttribute('text-anchor', 'middle');
        tx.setAttribute('font-size', '10'); tx.setAttribute('font-family', "'Outfit',sans-serif");
        tx.setAttribute('fill', e.k === 'tech' ? '#8B949E' : C.teal);
        tx.setAttribute('stroke', '#0D1117'); tx.setAttribute('stroke-width', '3'); tx.setAttribute('paint-order', 'stroke');
        tx.textContent = e.l;
        svg.appendChild(tx);
      });
    }
    Reveal.on('ready', drawGraph5);
    Reveal.on('slidechanged', function () { setTimeout(drawGraph5, 50); });
    window.addEventListener('resize', function () { setTimeout(drawGraph5, 100); });
  </script>
